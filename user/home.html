<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JL Customs - Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      overflow: hidden;
    }

    .estimate-btn {
      padding: 40px 80px;
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: #fff;
      background: #c0392b;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      user-select: none;
    }

    .estimate-btn:hover {
      background: #a93226;
    }

    .estimate-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <button class="estimate-btn" onclick="window.location.href='estimate.html'">Estimate</button>

  <script>
    const TIMEOUT_MS = 60 * 1000;
    let inactivityTimer;

    function goBack() {
      window.location.href = 'index.html';
    }

    function resetTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(goBack, TIMEOUT_MS);
    }

    ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'].forEach((event) => {
      document.addEventListener(event, resetTimer, { passive: true });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Backspace') {
        goBack();
      }
    });

    resetTimer();
  </script>
</body>
</html>
